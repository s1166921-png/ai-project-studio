<script>
(()=>{'use strict';

const R=6,PR=.45,FLOOR=R+PR,GRAVITY=-.015,BASE=.42,BOOST=.55;
function newRun(){return {x:0,y:FLOOR,z:0,vy:BASE,offset:0,peak:FLOOR,bonus:0,score:0,age:0,buffer:0,cooldown:0,dead:false}}
function spiral(y){return(y-FLOOR)*.17-Math.PI/2}

function tapRun(g){g.buffer=10;if(g.y<FLOOR+.8&&g.vy<=.12){g.vy=BASE;g.buffer=0;return true}if(g.cooldown===0){g.offset+=.19;g.cooldown=11}return false}
function tick(g,items,steer){if(g.dead)return {collect:[],jump:false,reason:''};const old={x:g.x,y:g.y,z:g.z},events={collect:[],jump:false,reason:''};g.age++;g.buffer=Math.max(0,g.buffer-1);g.cooldown=Math.max(0,g.cooldown-1);g.offset+=steer*.04;g.vy+=GRAVITY;g.y+=g.vy;if(g.y<=FLOOR){g.y=FLOOR;g.vy=BASE+(g.buffer? .045:0);g.buffer=0;events.jump=true}const angle=spiral(g.y)+g.offset,r=2.35*Math.min(1,g.age/13);g.x+=(Math.cos(angle)*r-g.x)*.24;g.z+=(Math.sin(angle)*r-g.z)*.24;g.peak=Math.max(g.peak,g.y);

class SoundFX{constructor(){this.ctx=null;this.muted=false}unlock(){try{if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;this.ctx=new A();this.gain=this.ctx.createGain();this.gain.gain.value=this.muted?0:.2;this.gain.connect(this.ctx.destination)}if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})}catch(e){}}tone(type,a,b,d,delay=0){if(!this.ctx||this.muted||this.ctx.state!=='running')return;const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+d);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.4,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.gain);o.start(t);o.stop(t+d+.02);o.onended=()=>{o.disconnect();g.disconnect()}}playJump(){this.tone('sine',250,600,.12)}playCollect(){[523.25,659.25,783.99].forEach((f,i)=>this.tone('triangle',f,f*1.01,.16,i*.055))}playGameOver(){this.tone('sawtooth',300,60,.5)}}

const planet=new THREE.Mesh(new THREE.IcosahedronGeometry(R,3),new THREE.MeshStandardMaterial({color:0x192940,roughness:.7,metalness:.35,flatShading:true}));planet.receiveShadow=true;planet.castShadow=true;scene.add(planet);const wire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(6.03,2)),new THREE.LineBasicMaterial({color:0x7799dd,transparent:true,opacity:.2}));planet.add(wire);
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(6.3,32,24),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:'varying vec3 N;varying vec3 V;void main(){vec4 p=modelViewMatrix*vec4(position,1.);N=normalize(normalMatrix*normal);V=-p.xyz;gl_Position=projectionMatrix*p;}',fragmentShader:'varying vec3 N;varying vec3 V;void main(){float a=pow(1.-abs(dot(normalize(N),normalize(V))),3.);gl_FragColor=vec4(1.,.2,.4,a*.4);}'}));scene.add(atmosphere);const ring=new THREE.Mesh(new THREE.TorusGeometry(7.3,.025,6,96),new THREE.MeshBasicMaterial({color:0xffcc00,transparent:true,opacity:.5}));ring.rotation.set(1.2,.2,-.2);scene.add(ring);
const player=new THREE.Mesh(new THREE.SphereGeometry(PR,24,16),new THREE.MeshStandardMaterial({color:0xff3366,emissive:0xff164f,emissiveIntensity:.9,roughness:.2,metalness:.2}));player.castShadow=true;scene.add(player);player.add(new THREE.PointLight(0xff3366,1.4,12,2));const halo=new THREE.Mesh(new THREE.SphereGeometry(.62,16,12),new THREE.MeshBasicMaterial({color:0xff3366,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false}));player.add(halo);
const starsData=new Float32Array((mobile?650:1100)*3);for(let i=0;i<starsData.length;i+=3){const a=Math.random()*Math.PI*2,r=28+Math.random()*85;starsData[i]=Math.cos(a)*r;starsData[i+1]=(Math.random()-.5)*160;starsData[i+2]=Math.sin(a)*r}const starsGeo=new THREE.BufferGeometry();starsGeo.setAttribute('position',new THREE.BufferAttribute(starsData,3));const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xc8d8ff,size:.1,transparent:true,opacity:.8,depthWrite:false}));scene.add(stars);
const whiteGeo=new THREE.SphereGeometry(.34,16,12),redGeo=new THREE.IcosahedronGeometry(.4,1),whiteMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xbddaff,emissiveIntensity:.7,roughness:.2}),redMat=new THREE.MeshStandardMaterial({color:0xff252e,emissive:0xff1025,emissiveIntensity:.6,flatShading:true});const pools=[[],[]];let items=[],nextY=10,index=0;
function spawn(){while(nextY<game.y+50){const red=index++>2&&Math.random()<.3,pool=pools[+red],mesh=pool.pop()||new THREE.Mesh(red?redGeo:whiteGeo,red?redMat:whiteMat),a=spiral(nextY),o={x:Math.cos(a)*2.35,y:nextY,z:Math.sin(a)*2.35,red,taken:false,mesh};mesh.position.set(o.x,o.y,o.z);scene.add(mesh);items.push(o);nextY+=4}}
function remove(i){const o=items[i];scene.remove(o.mesh);if(pools[+o.red].length<24)pools[+o.red].push(o.mesh);items.splice(i,1)}
const count=mobile?180:300,positions=new Float32Array(count*3),colors=new Float32Array(count*3),velocities=new Float32Array(count*3),life=new Float32Array(count),baseColors=new Float32Array(count*3);positions.fill(10000);const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(positions,3).setUsage(THREE.DynamicDrawUsage));pg.setAttribute('color',new THREE.BufferAttribute(colors,3).setUsage(THREE.DynamicDrawUsage));const particles=new THREE.Points(pg,new THREE.PointsMaterial({size:.17,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));particles.frustumCulled=false;scene.add(particles);let cursor=0;const col=new THREE.Color();
function emit(p,c,burst=false){const i=cursor++%count,j=i*3;positions[j]=p.x;positions[j+1]=p.y;positions[j+2]=p.z;life[i]=burst?.6:.35;col.set(c);baseColors[j]=col.r;baseColors[j+1]=col.g;baseColors[j+2]=col.b;for(let k=0;k<3;k++)velocities[j+k]=(Math.random()-.5)*(burst?8:1);if(!burst)velocities[j+1]=-2}
function burst(p,c){for(let i=0;i<(mobile?24:40);i++)emit(p,c,true)}
function updateParticles(dt){for(let i=0;i<count;i++){if(life[i]<=0)continue;life[i]-=dt;const j=i*3;if(life[i]<=0){positions[j+1]=10000;continue}for(let k=0;k<3;k++){positions[j+k]+=velocities[j+k]*dt;colors[j+k]=baseColors[j+k]*Math.min(1,life[i]*3)}}pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true}
let game=newRun(),state='ready',best=0,last=0,acc=0,toast=0,flash=0,pointer=null,lastScore=-1,parentPaused=false;const keys=new Set(),arrows=new Set();try{const n=Number(localStorage.getItem('hot-bounce-3d-best-v1'));if(Number.isFinite(n)&&n>0)best=Math.floor(n)}catch(e){}$('best').textContent=best;
function hud(){if(lastScore!==game.score){$('score').textContent=game.score;lastScore=game.score}$('altitude').textContent='ALTITUDE '+Math.floor(Math.max(0,game.y-FLOOR))+' M'}
function start(){if(parentPaused)return;sound.unlock();game=newRun();state='playing';nextY=10;index=0;acc=0;keys.clear();arrows.clear();pointer=null;while(items.length)remove(items.length-1);life.fill(0);positions.fill(10000);pg.attributes.position.needsUpdate=true;camera.position.set(0,11,camZ());spawn();hud();['start','over','paused'].forEach(x=>show(x,false));$('pause').disabled=false;canvas.focus({preventScroll:true});sound.playJump()}
function end(reason){state='over';keys.clear();arrows.clear();pointer=null;const record=game.score>best;if(record){best=game.score;try{localStorage.setItem('hot-bounce-3d-best-v1',best)}catch(e){}}$('best').textContent=best;$('result').textContent=game.score;$('reason').textContent=reason;$('record').textContent=record?'✦ 新纪录！你又跳得更远了':'最高纪录 '+best;$('pause').disabled=true;sound.playGameOver();burst(game,0xff3366);flash=.35;show('over',true);$('retry').focus({preventScroll:true})}
function pause(){if(state!=='playing')return;state='paused';keys.clear();arrows.clear();pointer=null;acc=0;show('paused',true)}function resume(){if(state!=='paused'||parentPaused)return;sound.unlock();state='playing';last=performance.now();acc=0;show('paused',false);canvas.focus({preventScroll:true})}
function tap(){if(state==='playing'){sound.unlock();if(tapRun(game))sound.playJump()}}
function frame(now){requestAnimationFrame(frame);if(document.hidden){last=now;return}const dt=Math.min(.05,(now-(last||now))/1000);last=now;if(state!=='paused'&&!parentPaused){planet.rotation.y+=.008*dt*60;planet.rotation.x+=.003*dt*60;ring.rotation.z+=dt*.05;if(!reduced)stars.rotation.y+=dt*.007;if(state==='playing'){acc+=dt;let loops=0;while(acc>=1/60&&loops++<4){acc-=1/60;const direction=(keys.has('ArrowRight')||keys.has('KeyD')||arrows.has(1)?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')||arrows.has(-1)?1:0),e=tick(game,items,direction);if(e.jump)sound.playJump();for(const o of e.collect){sound.playCollect();burst(o,0xffdd66);toast=.65;$('toast').textContent='+100 BOOST ↑';$('toast').style.opacity='1'}for(let i=items.length-1;i>=0;i--)if(items[i].taken||items[i].y<camera.position.y-20)remove(i);hud();if(game.dead){end(e.reason);break}spawn();if(!reduced)emit(game,0xff3366)}camera.position.y+=(Math.max(R+4,game.y+2)-camera.position.y)*(1-Math.pow(.92,dt*60))}updateParticles(dt);for(const o of items)if(o.red)o.mesh.rotation.y+=dt*.8;halo.scale.setScalar(reduced?1:1+Math.sin(now*.006)*.06)}player.position.set(game.x,game.y,game.z);stars.position.y=camera.position.y;camera.lookAt(0,camera.position.y-2,0);if(toast>0){toast-=dt;if(toast<=0)$('toast').style.opacity='0'}flash=Math.max(0,flash-dt);$('flash').style.opacity=reduced?'0':String(flash*.6);renderer.render(scene,camera)}
