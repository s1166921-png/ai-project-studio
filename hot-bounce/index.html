function aim(e){if(state!=='playing')return;const rect=canvas.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,1-(e.clientY-rect.top)/rect.height*2);camera.updateMatrixWorld();ray.setFromCamera(mouse,camera);if(ray.ray.intersectPlane(plane,hit)&&hit.length()>1.2){game.target=Math.atan2(hit.y*.94+hit.z*Math.sqrt(1-.94*.94),hit.x);const p=orbitPoint(game.target,game.radius+1);aimMarker.position.set(p.x,p.y,p.z);aimMarker.visible=true}}
canvas.addEventListener('pointermove',aim);canvas.addEventListener('pointerdown',e=>{sound.unlock();canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);aim(e)});canvas.addEventListener('pointerleave',()=>aimMarker.visible=false);
for(const [id,dir] of [['left',-1],['right',1]]){const b=$(id);b.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();b.setPointerCapture(e.pointerId);arrows.add(dir)});['pointerup','pointercancel','lostpointercapture','blur'].forEach(n=>b.addEventListener(n,()=>arrows.delete(dir)))}
window.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button,a'))return;if(e.code==='KeyP'||e.code==='Escape'){e.preventDefault();if(!e.repeat){if(state==='playing')pause();else resume()}return}if(state!=='playing')return;if(['Space','ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code)){e.preventDefault();keys.add(e.code);if(e.code==='Space'&&!e.repeat)tap()}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden)pause()});
$('startButton').onclick=start;$('retry').onclick=start;$('pause').onclick=pause;$('resume').onclick=resume;$('sound').onclick=()=>{sound.unlock();sound.muted=!sound.muted;if(sound.ctx)sound.gain.gain.setTargetAtTime(sound.muted?0:.2,sound.ctx.currentTime,.02);$('sound').textContent=sound.muted?'音效 关':'音效 开';$('sound').setAttribute('aria-label',sound.muted?'开启音效':'关闭音效')};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='portfolio-game-pause')return;parentPaused=!!e.data.paused;if(parentPaused)pause()});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.position.z=cameraTarget.z+camZ();camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();pause();fail('图形上下文已中断，请重新加载。最高分已保存在本机。')});if(window===window.top)$('expand').style.display='none';spawn();hud();requestAnimationFrame(frame);
})();
</script></body></html>
